<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex Navbar</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: #fff;
      box-shadow: 0 2px 8px rgb(0 0 0 / 10%);
    }

    .logo {
      color: #172554;
      font-size: 1.4rem;
      font-weight: 700;
      text-decoration: none;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: #334155;
      text-decoration: none;
    }

    .nav-links a:hover {
      color: #2563eb;
    }

    .navbar-button {
      padding: 0.65rem 1rem;
      border: 0;
      border-radius: 0.4rem;
      background: #2563eb;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .navbar {
        padding: 1rem;
      }

      .navbar-right {
        gap: 0.75rem;
      }

      .nav-links {
        gap: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <nav class="navbar" aria-label="Main navigation">
    <a class="logo" href="#">Brand</a>
    <div class="navbar-right">
      <ul class="nav-links">
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
      </ul>
      <button class="navbar-button" type="button">Get started</button>
    </div>
  </nav>
</body>
</html>
