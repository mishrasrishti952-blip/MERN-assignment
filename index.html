<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 30px;
            color: #243447;
        }

        h1 {
            text-align: center;
            color: #2457a7;
        }

        .card {
            width: 300px;
            background-color: #ffffff;
            padding: 25px;
            border: 5px solid #3478c9;
            margin: 40px auto;
            border-radius: 12px;
        }

        .card h2 {
            margin-top: 0;
            color: #2457a7;
        }

        .card p {
            line-height: 1.6;
        }

        .label {
            text-align: center;
            color: #526579;
        }
    </style>
</head>

<body>
    <h1>CSS Box Model</h1>

    <p class="label">
        Student of BTech CSE in Invertis University.
    </p>

    <div class="card">
        <h2>Box Model</h2>
        <p>
            Padding creates space inside the border.
            Border surrounds the content and padding.
            Margin creates space outside the border.
        </p>
    </div>
</body>
</html>
