<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 2rem;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .layout {
      display: grid;
      grid-template-columns: 200px minmax(0, 1fr);
      grid-template-areas:
        "head head"
        "side main"
        "foot foot";
      gap: 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .head {
      grid-area: head;
      text-align: center;
      padding: 1rem;
      border-radius: 12px;
      background: #dbeafe;
    }

    .side {
      grid-area: side;
      padding: 1rem;
      border-radius: 12px;
      background: #e2e8f0;
    }

    .main {
      grid-area: main;
      min-width: 0;
    }

    .foot {
      grid-area: foot;
      padding: 1rem;
      border-radius: 12px;
      background: #dbeafe;
      text-align: center;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 1rem;
    }

    .grid-item {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      min-height: 140px;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 1.25rem;
      font-weight: bold;
    }

    .grid-icon {
      font-size: 1.5rem;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .layout {
        grid-template-columns: minmax(0, 1fr);
        grid-template-areas:
          "head"
          "side"
          "main"
          "foot";
      }
    }

  </style>
</head>
<body>
  <div class="layout">
    <header class="head">
      <h1>A Simple CSS Grid</h1>
    </header>
    <aside class="side" aria-label="Sidebar">Side</aside>
    <main class="main">
      <section class="cards" aria-label="Grid of cards">
        <div class="grid-item"><span class="grid-icon" aria-hidden="true">★</span><span>Item 1</span></div>
        <div class="grid-item"><span class="grid-icon" aria-hidden="true">♥</span><span>Item 2</span></div>
        <div class="grid-item"><span class="grid-icon" aria-hidden="true">⚡</span><span>Item 3</span></div>
        <div class="grid-item"><span class="grid-icon" aria-hidden="true">☘</span><span>Item 4</span></div>
        <div class="grid-item"><span class="grid-icon" aria-hidden="true">♫</span><span>Item 5</span></div>
        <div class="grid-item"><span class="grid-icon" aria-hidden="true">☀</span><span>Item 6</span></div>
      </section>
    </main>
    <footer class="foot">Foot</footer>
  </div>
</body>
</html>
